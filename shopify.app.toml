# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "565c4664a7b842ddeabe5a2dbea1b308"
application_url = "https://billoxi-app.vercel.app"
embedded = true
name = "Billoxi"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_metaobjects,read_metaobjects,write_metaobject_definitions,read_metaobject_definitions,read_orders,read_customers,read_merchant_managed_fulfillment_orders,read_assigned_fulfillment_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance webhooks (GDPR / privacy law)
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://billoxi-app.vercel.app/auth/callback",
  "https://billoxi-app.vercel.app/auth/shop",
  "https://billoxi-app.vercel.app/api/auth"
]

[build]
automatically_update_urls_on_dev = true
